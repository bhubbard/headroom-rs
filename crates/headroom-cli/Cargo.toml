[package]
name = "headroom-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Unified pure-Rust CLI for Headroom context compression, reverse proxy, MCP server, wrap, diagnostics, and savings inspection."

[[bin]]
name = "headroom"
path = "src/main.rs"

[lib]
name = "headroom_cli"
path = "src/lib.rs"

[dependencies]
headroom-core = { path = "../headroom-core" }
headroom-proxy = { path = "../headroom-proxy" }
headroom-mcp = { path = "../headroom-mcp" }
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
humantime = "2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
